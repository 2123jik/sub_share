name: High-Speed Sub Sync

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天两次
  workflow_dispatch:        # 支持手动运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. 一键腾出 40GB+ 磁盘空间（避免 Disk quota exceeded）
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: 2. 检出当前 Git 仓库
        uses: actions/checkout@v4

      - name: 3. 安装 SVN
        run: sudo apt-get update -qq && sudo apt-get install -y subversion

      - name: 4. 直接同步最新 SVN 内容并推送到 GitHub
        run: |
          # 原地强制覆盖导出，不占用额外的临时目录
          svn export --force \
            --username test --password "" --no-auth-cache --non-interactive \
            --trust-server-cert-failures=unknown-ca,cn-mismatch,expired,not-yet-valid,other \
            https://svn.acgdev.com:505/svn/sub_share/trunk/subs_list ./subs_list

          # 提交变动
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subs_list
          
          # 仅在有更新时提交推送
          if ! git diff --staged --quiet; then
            git commit -m "sync: auto update from svn ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push
          fi
