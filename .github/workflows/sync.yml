name: High-Speed Sub Sync

on:
  schedule:
    # 每天自动极速巡检 2 次（北京时间 8点 和 20点）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  fast_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 确保 Actions 拥有写入/推送权限
    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. 安装 SVN 工具
        run: sudo apt-get update -qq && sudo apt-get install -y subversion

      - name: 3. 分批断点追更与实时推送
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u - << 'EOF'
          import subprocess
          import xml.etree.ElementTree as ET
          import os
          import sys
          import time
          import shutil
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import threading

          SVN_OPTS = [
              "--username", "test",
              "--password", "",
              "--no-auth-cache",
              "--non-interactive",
              "--trust-server-cert-failures=unknown-ca,cn-mismatch,expired,not-yet-valid,other"
          ]

          BASE_SVN = "https://svn.acgdev.com:505/svn/sub_share/trunk"
          REV_FILE = ".last_sync_rev"
          MAX_WORKERS = 16  # 并发数
          BATCH_REVS = 10   # 每 10 个 SVN 版本保存推送一次（断点检查点）

          def run(cmd):
              return subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)

          # 0. 配置 Git 基础信息并确认当前分支
          run(["git", "config", "user.name", "github-actions[bot]"])
          run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"])
          branch_res = run(["git", "branch", "--show-current"]).stdout.strip()
          target_branch = branch_res if branch_res else "master"
          print(f"[*] 当前推送目标分支为: {target_branch}", flush=True)

          # 1. 询问原站当前的最新版本号
          print("[*] 正在连接原站 SVN 查询最新版本...", flush=True)
          info = run(["svn", "info", "--show-item", "revision", BASE_SVN] + SVN_OPTS)
          if info.returncode != 0:
              print(f"[-] 连接失败: {info.stderr}", flush=True)
              sys.exit(1)

          head_rev = int(info.stdout.strip())
          print(f"[+] 原站当前最新版本: r{head_rev}", flush=True)

          # 2. 确定追踪区间
          if os.path.exists(REV_FILE):
              with open(REV_FILE, "r") as f:
                  start_rev = int(f.read().strip())
              if start_rev >= head_rev:
                  print(f"[SUCCESS] 本地已是最新版本 (r{head_rev})，无需更新！", flush=True)
                  sys.exit(0)
              print(f"[*] 检测到断点进度，执行增量追更: r{start_rev + 1} -> r{head_rev}", flush=True)
              query_start = start_rev + 1
          else:
              query_start = max(1, head_rev - 85)
              print(f"[!] 首次追更：从 r{query_start} 到 r{head_rev} 分批进行...", flush=True)

          # 3. 按批次循环处理并及时 commit/push（防爆机制）
          current_rev = query_start
          while current_rev <= head_rev:
              batch_end = min(current_rev + BATCH_REVS - 1, head_rev)
              print(f"\n=======================================================", flush=True)
              print(f"[*] 开始处理批次: r{current_rev} -> r{batch_end} (总目标: r{head_rev})", flush=True)
              print(f"=======================================================", flush=True)

              log_cmd = ["svn", "log", "-v", "--xml", f"-r{current_rev}:{batch_end}", BASE_SVN] + SVN_OPTS
              log_res = run(log_cmd)
              if log_res.returncode != 0:
                  print(f"[-] 获取日志失败: {log_res.stderr}", flush=True)
                  sys.exit(1)

              root = ET.fromstring(log_res.stdout)
              file_actions = {}
              for logentry in root.findall("logentry"):
                  for p in logentry.findall("./paths/path"):
                      action = p.get("action")
                      path_text = p.text
                      if path_text and "/subs_list/" in path_text:
                          rel_path = path_text.split("/trunk/")[-1]
                          file_actions[rel_path] = action

              # 删除操作
              for rel_path, action in list(file_actions.items()):
                  if action == "D":
                      if os.path.exists(rel_path):
                          if os.path.isdir(rel_path):
                              shutil.rmtree(rel_path, ignore_errors=True)
                          else:
                              os.remove(rel_path)
                      del file_actions[rel_path]

              download_list = [(path, f"{BASE_SVN}/{path}") for path in file_actions.keys()]
              total_files = len(download_list)
              print(f"[+] 该批次有 {total_files} 个文件变更", flush=True)

              if total_files > 0:
                  counter = [0]  # 改用容器对象避开变量作用域 Bug
                  print_lock = threading.Lock()

                  def download_single_file(item):
                      rel_path, file_url = item
                      os.makedirs(os.path.dirname(rel_path), exist_ok=True)
                      for attempt in range(3):
                          try:
                              res = subprocess.run(
                                  ["svn", "export", "--force", file_url, rel_path] + SVN_OPTS,
                                  stdout=subprocess.PIPE,
                                  stderr=subprocess.PIPE,
                                  timeout=25
                              )
                              if res.returncode == 0:
                                  with print_lock:
                                      counter[0] += 1
                                      if counter[0] % 50 == 0 or counter[0] == total_files:
                                          print(f"[{counter[0]}/{total_files}] 完成", flush=True)
                                  return True
                          except subprocess.TimeoutExpired:
                              pass
                          time.sleep(1)
                      with print_lock:
                          print(f"[WARN] 跳过拉取超时文件: {rel_path}", flush=True)
                      return False

                  start_time = time.time()
                  with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
                      futures = [executor.submit(download_single_file, item) for item in download_list]
                      for f in as_completed(futures):
                          f.result()
                  print(f"[+] 批次下载完成，耗时 {round(time.time() - start_time, 1)} 秒", flush=True)

              # 更新检查点版本号并提交
              with open(REV_FILE, "w") as f:
                  f.write(str(batch_end))

              run(["git", "add", "-A"])
              status = run(["git", "status", "--porcelain"]).stdout.strip()
              if status:
                  commit_msg = f"sync: checkpoint up to r{batch_end}"
                  print(f"[*] 正在推送进度到 GitHub: {commit_msg}", flush=True)
                  run(["git", "commit", "-m", commit_msg])
                  run(["git", "pull", "--rebase", "origin", target_branch])
                  push_res = run(["git", "push", "origin", f"HEAD:{target_branch}"])
                  if push_res.returncode != 0:
                      print(f"[-] 推送失败: {push_res.stderr}", flush=True)
                      sys.exit(1)
                  print(f"[✓] 成功推送到 r{batch_end}！", flush=True)

              current_rev = batch_end + 1

          print("\n[SUCCESS] 全部追更顺利完成，已和原站版本完全一致！", flush=True)
          EOF
